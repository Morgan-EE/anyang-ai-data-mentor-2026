<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface-2:#f7f9fc;--border:#e2e7ef;--text:#141c2b;--text-2:#465267;--text-3:#7a8699;
  --accent:#1f4fd8;--accent-soft:#e8eefc;--on-accent:#fff;--ok:#0f7b4f;--ok-soft:#e3f5ec;--warn-soft:#fdf2df;
  --violet:#6d3fd9;--violet-soft:#f1ebff;--amber:#b45f06;--amber-soft:#fff4e5;--teal:#0b7d74;--teal-soft:#e3f6f4;--blue:#1f5fd8;--blue-soft:#e7effd;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141b;--surface:#171e28;--surface-2:#1c2431;--border:#2a3444;--text:#e8edf4;--text-2:#b6c1d1;--text-3:#8b98ab;
  --accent:#7ea2ff;--accent-soft:#1d2a47;--on-accent:#0f141b;--ok:#6fdcab;--ok-soft:#133127;--warn-soft:#382a14;
  --violet:#b79cff;--violet-soft:#2a2140;--amber:#f4b25c;--amber-soft:#352816;--teal:#5fd3c6;--teal-soft:#13302d;--blue:#86acff;--blue-soft:#18284a;
  color-scheme:dark;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:1.55rem;line-height:1.35;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:1.2rem;line-height:1.4;margin:0 0 8px}
h3{font-size:1.02rem;margin:14px 0 6px}
p{margin:0 0 10px}
ul{margin:0 0 6px;padding-left:1.2em}li{margin:4px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:14px}
.eyebrow{font-size:.8rem;font-weight:800;color:var(--text-3);letter-spacing:.03em}
.muted{color:var(--text-3)}.small{font-size:.88rem}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.hero{background:var(--accent);color:var(--on-accent);border:0}
.hero h1{color:var(--on-accent)}
.hero p{opacity:.92}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.badges span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
.bar{height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qn{font-size:.85rem;font-weight:800;color:var(--accent)}
.qt{font-size:1.35rem;font-weight:800;line-height:1.4;margin:4px 0 4px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 14px;border:2px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.opt .em{font-size:1.35rem;flex:none;width:30px;text-align:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.unk{border-style:dashed;color:var(--text-2)}
.result-top{border-top:6px solid var(--jc);padding-top:16px}
.jt{color:var(--jc);display:flex;align-items:center;gap:10px}
.jt .ic{width:42px;height:42px;border-radius:12px;background:var(--jcs);display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.c-violet{--jc:var(--violet);--jcs:var(--violet-soft)}.c-amber{--jc:var(--amber);--jcs:var(--amber-soft)}.c-teal{--jc:var(--teal);--jcs:var(--teal-soft)}.c-blue{--jc:var(--blue);--jcs:var(--blue-soft)}.c-gray{--jc:var(--accent);--jcs:var(--accent-soft)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.note.warn{background:var(--warn-soft)}
.mission{background:var(--ok-soft);border-radius:12px;padding:14px;font-weight:800}
.day{list-style:none;padding:0;margin:0}
.day li{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border)}
.day li:last-child{border-bottom:0}
.day b{color:var(--jc)}
.chips span{display:inline-block;font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);margin:3px 4px 3px 0}
.show{border:2px solid var(--accent)}
.show dl{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;margin:8px 0 0}
.show dt{color:var(--text-3);font-weight:800;font-size:.88rem}.show dd{margin:0;font-weight:700}
.exp{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--surface-2)}
.ox{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:10px}
.ox .q{font-weight:700}
.ox .b{display:flex;gap:8px;margin-top:8px}
.ox .b button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.ox .a{margin-top:8px;font-size:.92rem;display:none}
.ox.done .a{display:block}
.ox.right{border-color:var(--ok)}.ox.wrong{border-color:#d4453b}
footer{margin-top:22px;font-size:.8rem;color:var(--text-3);text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tl-board{background:#050607;color:#f1f5f4;border-radius:16px;padding:18px 16px 14px;margin-top:14px;border:1px solid #1d2422}
.tl-kicker{font-size:.75rem;color:#8a9692;margin-bottom:8px}
.tl-title{text-align:center;font-weight:800;font-size:1.2rem;line-height:1.35;margin:2px 0 14px}
.tl-title em{font-style:normal;color:#4fe3c1}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px;position:relative}
.tl::before{content:"";position:absolute;left:59px;top:14px;bottom:14px;border-left:2px dashed #2c6e5f}
.tl li{display:flex;align-items:center;gap:10px;padding:6px 0;position:relative}
.tl .y{width:38px;flex:none;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:.74rem;color:#4fe3c1}
.tl .d{width:24px;height:24px;flex:none;border-radius:50%;border:2.5px solid #4fe3c1;background:#050607;position:relative;z-index:1}
.tl .now .d{background:#4fe3c1;box-shadow:0 0 0 5px rgba(79,227,193,.18)}
.tl b{display:block;font-size:1.05rem}.tl .now b{color:#4fe3c1}
.tl .l{font-size:.86rem;color:#a7b3af}
.tl-src{font-size:.7rem;color:#6b7672;margin-top:10px}
.tl-more{font-size:.9rem;color:#d6dedb;margin-top:10px;border-top:1px solid #1d2422;padding-top:10px}
</style>

    '<dt>경험</dt><dd>'+esc(r.q3?r.q3.l:"미응답")+'</dd><dt>졸업 후</dt><dd>'+esc(r.q4?r.q4.l:"미응답")+'</dd><dt>공부 시간</dt><dd>'+esc(r.q5?r.q5.l:"미응답")+'</dd>'+
    '<dt>궁금한 것</dt><dd>'+(asks.length?asks.map(esc).join(", "):"없음")+'</dd></dl></div>';
  h+='<div class="row"><button class="btn" data-a="prev">← 답 고치기</button><button class="btn" data-a="restart">처음부터 다시</button></div>'+
    '<footer>결과 화면을 캡처해 두면 나중에 다시 볼 수 있어요.<br>답변은 서버로 전송되거나 저장되지 않아요.</footer>';
  return h;
}

app.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var a=b.getAttribute("data-a"),o=b.getAttribute("data-o"),x=b.getAttribute("data-x");
  if(a==="start"){S.step=0;S.ans={};}
  else if(a==="prev"){S.step=Math.max(-1,S.step-1);}
  else if(a==="next"){S.step++;}
  else if(a==="restart"){S={step:-1,ans:{}};}
  else if(o){
    var q=Q[S.step];
    if(q.multi){var cur=S.ans[q.id]||[],i=cur.indexOf(o);
      if(i>=0)cur.splice(i,1);else if(cur.length<q.multi)cur.push(o);else{cur.shift();cur.push(o);}
      S.ans[q.id]=cur;save();
      Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(el){var on=cur.indexOf(el.getAttribute("data-o"))>=0;el.classList.toggle("sel",on);el.setAttribute("aria-pressed",on);});
      return;}
    S.ans[q.id]=o;S.step++;
  }
  else if(x){var box=b.closest(".ox"),it=OX[+box.getAttribute("data-ox")],right=x===it.a;
    box.classList.add("done");box.classList.toggle("right",right);box.classList.toggle("wrong",!right);
    box.querySelector(".a").innerHTML=(right?"✅ 정답! ":"🙂 아쉬워요. 정답은 "+it.a+". ")+esc(it.e);return;}
  else return;
  save();render();
});
render();
window.__S_TEST__={compute:function(ans){var keep=S;S={step:99,ans:ans};var r=compute();S=keep;return r;},Q:Q};
})();
</script>
